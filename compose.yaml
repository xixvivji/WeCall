services:
  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: wecall
      POSTGRES_USER: wecall
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wecall-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecall -d wecall"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
