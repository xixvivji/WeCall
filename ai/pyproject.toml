[project]
name = "wecall-ai"
version = "0.1.0"
description = "WeCall AI analysis service"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
