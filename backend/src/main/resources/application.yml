spring:
  application:
    name: wecall-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wecall}
    username: ${DB_USERNAME:wecall}
    password: ${DB_PASSWORD:wecall-local-only}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
wecall:
  attachments:
    directory: ${WECALL_ATTACHMENT_DIR:${user.home}/.wecall/attachments}
    scan:
      mode: ${WECALL_ATTACHMENT_SCAN_MODE:disabled}
      host: ${WECALL_CLAMD_HOST:127.0.0.1}
      port: ${WECALL_CLAMD_PORT:3310}
      timeout-ms: ${WECALL_CLAMD_TIMEOUT_MS:10000}
  ai:
    base-url: ${WECALL_AI_BASE_URL:http://127.0.0.1:8000}
    service-token: ${WECALL_AI_SERVICE_TOKEN:}
    allow-mock: ${WECALL_AI_ALLOW_MOCK:false}
    read-timeout-ms: ${WECALL_AI_READ_TIMEOUT_MS:10000}
